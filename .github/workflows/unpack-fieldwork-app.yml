name: Unpack fieldwork app

on:
  workflow_dispatch:
  push:
    paths:
      - ".codex_upload/parts/**"
      - ".github/workflows/unpack-fieldwork-app.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack latest fieldwork app
        run: |
          set -euo pipefail
          rm -rf fieldwork_app_review_copy
          mkdir -p /tmp/fieldwork-upload
          cat .codex_upload/parts/*.b64 > /tmp/fieldwork_app_review_copy_upload.b64
          base64 -d /tmp/fieldwork_app_review_copy_upload.b64 > /tmp/fieldwork_app_review_copy_upload.zip
          unzip -q /tmp/fieldwork_app_review_copy_upload.zip -d /tmp/fieldwork-upload
          cp -R /tmp/fieldwork-upload/fieldwork_app_review_copy ./fieldwork_app_review_copy
          rm -rf .codex_upload

      - name: Commit expanded app files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fieldwork_app_review_copy .codex_upload
          if git diff --cached --quiet; then
            echo "No fieldwork app changes to commit."
          else
            git commit -m "Upload latest fieldwork web app"
            git push
          fi
