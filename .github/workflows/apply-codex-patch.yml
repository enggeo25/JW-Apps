name: Apply Codex Patch

on:
  workflow_dispatch:
  push:
    paths:
      - ".codex_patches/*.patch"
      - ".github/workflows/apply-codex-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Codex patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patch_files=(.codex_patches/*.patch)
          if [ ${#patch_files[@]} -eq 0 ]; then
            echo "No Codex patch files found. Nothing to apply."
            exit 0
          fi
          for patch_file in "${patch_files[@]}"; do
            echo "Applying $patch_file"
            git apply --recount --whitespace=fix "$patch_file"
            rm "$patch_file"
          done
          rmdir .codex_patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fieldwork_app_review_copy .codex_patches || true
          if git diff --cached --quiet; then
            echo "Patch made no changes."
            exit 0
          fi
          git commit -m "Apply fieldwork overnight polish"
          git push

# Codex trigger: apply pending fieldwork patches.
# Codex trigger: recount hunk headers and apply pending fieldwork patches.
